name: Tailscale Connection Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    env:
      TAILSCALE_IP: ${{ secrets.TAILSCALE_IP }}

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          args: --accept-routes

      - name: Check Tailscale Status
        shell: powershell
        run: |
          tailscale status

      - name: Test RDP Connection
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
            Write-Error "TAILSCALE_IP secret is missing."
            exit 1
          }

          Write-Host "Target IP: $env:TAILSCALE_IP"
          Write-Host "Testing RDP port 3389..."
          $result = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            Write-Error "RDP port 3389 is not reachable on $env:TAILSCALE_IP."
            exit 1
          }

          Write-Host "RDP port 3389 is reachable!"
